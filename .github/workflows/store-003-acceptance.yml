name: STORE-003 acceptance

on:
  push:
    branches: [p0/store-003-acceptance, store-004/demo, store-005/launch-prep, design-002/polish, release-001/candidate]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buyer:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      COMPOSE_PROJECT_NAME: top-pariks-store003
      TOP_PARIKS_URL: http://localhost:8080
      TOP_PARIKS_STORE005: ${{ github.ref_name == 'store-005/launch-prep' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Audit tracked files for credential patterns
        if: github.ref_name == 'store-005/launch-prep' || github.ref_name == 'release-001/candidate'
        run: python3 -B sandbox/store-005-secret-audit.py
      - name: Start isolated WooCommerce
        run: ./sandbox/start.sh
      - name: Install official Russian translations and test fixtures
        run: |
          set -euo pipefail
          lang="$RUNNER_TEMP/locales"
          mkdir -p "$lang/plugins"
          curl -fsSL --max-time 60 https://downloads.wordpress.org/translation/core/7.1.5/ru_RU.zip -o "$RUNNER_TEMP/wordpress-ru.zip"
          curl -fsSL --max-time 60 https://downloads.wordpress.org/translation/plugin/woocommerce/11.3.1/ru_RU.zip -o "$RUNNER_TEMP/woocommerce-ru.zip"
          unzip -oq "$RUNNER_TEMP/wordpress-ru.zip" -d "$lang"
          unzip -oq "$RUNNER_TEMP/woocommerce-ru.zip" -d "$lang/plugins"
          docker compose exec -T wordpress mkdir -p /var/www/html/wp-content/languages
          docker compose cp "$lang/." wordpress:/var/www/html/wp-content/languages/
          docker compose cp sandbox/store-003-mail.php wordpress:/var/www/html/wp-content/mu-plugins/store-003-mail.php
          wp() { docker compose exec -T --user www-data wordpress php /tmp/top-pariks-wp-cli.phar --url="$TOP_PARIKS_URL" "$@"; }
          wp config set TOP_PARIKS_STORE003_CAPTURE true --raw
          wp option update WPLANG ru_RU
          wp eval '$result = tp_provision_storefront(); if (is_wp_error($result)) { WP_CLI::error($result->get_error_message()); }'
          wp eval-file - < sandbox/store-003-fixtures.php
          wp eval 'printf("WordPress %s, WooCommerce %s, locale %s\n", get_bloginfo("version"), WC_VERSION, get_locale()); foreach (["shop", "cart", "checkout", "myaccount"] as $page) { if (wc_get_page_id($page) < 1) { WP_CLI::error($page); } }'
          wp plugin list --status=must-use
          if [[ "$TOP_PARIKS_STORE005" == yes || "$GITHUB_REF_NAME" == release-001/candidate ]]; then
            wp eval '$customer = get_role("customer"); $manager = get_role("shop_manager"); if (!$customer || !$manager || $customer->has_cap("edit_products") || $customer->has_cap("manage_woocommerce") || !$manager->has_cap("edit_products")) { WP_CLI::error("Unexpected storefront role capabilities"); } WP_CLI::success("Customer and shop-manager role separation verified.");'
          fi
      - name: Package and restore the demonstration independently
        if: github.ref_name == 'store-004/demo' || github.ref_name == 'store-005/launch-prep'
        env:
          ATELIER_RESTORE_PROJECT: atelier-restore-ci
          ATELIER_DEMO_DB_PASSWORD: isolated-ci-demo-db
          ATELIER_DEMO_PORT: 8086
        run: |
          set -euo pipefail
          wp() { docker compose exec -T --user www-data wordpress php /tmp/top-pariks-wp-cli.phar --url="$TOP_PARIKS_URL" "$@"; }
          wp eval-file - < sandbox/store-004-content.php
          bash sandbox/store-004-package.sh "$RUNNER_TEMP/atelier-portable"
          (
            cd "$RUNNER_TEMP/atelier-portable"
            dc=(docker compose -p "$ATELIER_RESTORE_PROJECT" -f compose.yaml)
            trap '"${dc[@]}" down --volumes' EXIT
            bash restore.sh
            for route in / /shop/ /product/topqa-natural/ /product/topqa-choice/ /cart/ /my-account/ /wig-care/; do
              curl -fsSL --max-time 20 "http://localhost:8086$route" -o "$RUNNER_TEMP/restore-response.html"
            done
            "${dc[@]}" exec -T --user www-data wordpress php /tmp/atelier-wp-cli.phar --url=http://localhost:8086 eval '
              $p = wc_get_product(wc_get_product_id_by_sku("TOPQA-NATURAL"));
              $v = wc_get_product(wc_get_product_id_by_sku("TOPQA-CHOICE"));
              if (!$p || !is_file(get_attached_file($p->get_image_id())) || !$v || count($v->get_children()) !== 2 || get_locale() !== "ru_RU" || home_url() !== "http://localhost:8086") {
                 WP_CLI::error("Post-restore data checks failed");
              }
              WP_CLI::success("Independent restore verified: database, image file, variations, locale and new URL.");
            '
            if [[ "$TOP_PARIKS_STORE005" == yes ]]; then
              "${dc[@]}" exec -T --user www-data wordpress php /tmp/atelier-wp-cli.phar --url=http://localhost:8086 eval '
                if (get_option("blog_public") !== "0") { WP_CLI::error("Restored copy permits indexing"); }
                foreach (get_users() as $user) {
                  if ($user->user_pass !== "*") { WP_CLI::error("Restored account password was not disabled"); }
                }
                WP_CLI::success("Restored demo blocks indexing and contains no usable account passwords.");
              '
            fi
          )
          echo 'TOP_PARIKS_STORE004=yes' >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: github.ref_name == 'store-004/demo' || github.ref_name == 'store-005/launch-prep'
        with:
          name: atelier-portable
          path: ${{ runner.temp }}/atelier-portable/
          retention-days: 14
      - name: Prepare release demonstration content
        if: github.ref_name == 'release-001/candidate'
        run: |
          docker compose exec -T --user www-data wordpress php /tmp/top-pariks-wp-cli.phar --url="$TOP_PARIKS_URL" eval-file - < sandbox/store-004-content.php
          echo 'TOP_PARIKS_STORE004=yes' >> "$GITHUB_ENV"
      - name: Build and restore the release archive from its exported bytes
        if: github.ref_name == 'release-001/candidate'
        env:
          ATELIER_RESTORE_PROJECT: atelier-restore-release
          ATELIER_DEMO_PORT: 8086
        run: ATELIER_DEMO_DB_PASSWORD="$(openssl rand -hex 24)" bash sandbox/release-001-package.sh "$RUNNER_TEMP/release-001-portable"
      - uses: actions/upload-artifact@v4
        if: github.ref_name == 'release-001/candidate'
        with:
          name: release-001-portable
          path: ${{ runner.temp }}/release-001-portable/
          if-no-files-found: error
          retention-days: 90
      - name: Import and update synthetic products by SKU
        if: github.ref_name == 'store-005/launch-prep' || github.ref_name == 'release-001/candidate'
        run: |
          docker compose cp docs/store-005-catalog-template.csv wordpress:/tmp/store-005-catalog-template.csv
          docker compose exec -T --user www-data wordpress php /tmp/top-pariks-wp-cli.phar --url="$TOP_PARIKS_URL" --user=topqa eval-file - < sandbox/store-005-import.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser engines
        run: |
          packages=(playwright-core@1.56.1)
          if [[ "$TOP_PARIKS_STORE005" == yes || "$GITHUB_REF_NAME" == design-002/polish ]]; then
            packages+=(lighthouse@12.8.2)
          fi
          npm install --no-save --package-lock=false "${packages[@]}"
          npx playwright-core install --with-deps chromium
          if npx playwright-core install --with-deps webkit; then
            echo 'TOP_PARIKS_TEST_WEBKIT=yes' >> "$GITHUB_ENV"
          fi
      - name: Technical SEO audit
        if: github.ref_name == 'store-005/launch-prep' || github.ref_name == 'release-001/candidate'
        run: node sandbox/store-005-seo.cjs
      - name: Capture DESIGN-002 before and after on one storefront
        if: github.ref_name == 'design-002/polish'
        run: |
          set -euo pipefail
          wp() { docker compose exec -T --user www-data wordpress php /tmp/top-pariks-wp-cli.phar --url="$TOP_PARIKS_URL" "$@"; }
          wp eval-file - < sandbox/store-004-content.php
          echo 'TOP_PARIKS_STORE004=yes' >> "$GITHUB_ENV"
          docker compose exec -T wordpress mkdir -p /var/www/html/wp-content/themes/top-pariks-baseline
          git archive 3735902:theme/top-pariks | docker compose exec -T wordpress tar -xf - -C /var/www/html/wp-content/themes/top-pariks-baseline
          wp eval 'update_option("theme_mods_top-pariks-baseline", get_option("theme_mods_top-pariks", []));'
          trap 'wp theme activate top-pariks' EXIT
          wp theme activate top-pariks-baseline
          node sandbox/design-002-visual.cjs before
          wp theme activate top-pariks
          trap - EXIT
          node sandbox/design-002-visual.cjs after
      - uses: actions/upload-artifact@v4
        if: always() && github.ref_name == 'design-002/polish'
        with:
          name: design-002-screenshots
          path: design-002-screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Capture release pages at mobile and desktop widths
        if: github.ref_name == 'release-001/candidate'
        run: node sandbox/design-002-visual.cjs after
      - uses: actions/upload-artifact@v4
        if: always() && github.ref_name == 'release-001/candidate'
        with:
          name: release-001-screenshots
          path: design-002-screenshots/after/
          if-no-files-found: ignore
          retention-days: 30
      - name: Buyer acceptance
        run: node sandbox/store-003-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-003-screenshots
          path: store-003-screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify release controls in WordPress Admin
        if: github.ref_name == 'release-001/candidate'
        run: node sandbox/release-001-admin.cjs
      - name: Repeat Lighthouse lab runs
        if: github.ref_name == 'store-005/launch-prep' || github.ref_name == 'design-002/polish'
        run: bash sandbox/store-005-lighthouse.sh
      - uses: actions/upload-artifact@v4
        if: always() && (github.ref_name == 'store-005/launch-prep' || github.ref_name == 'design-002/polish')
        with:
          name: store-005-lighthouse
          path: store-005-lighthouse/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop isolated containers
        if: always()
        run: docker compose down --volumes
