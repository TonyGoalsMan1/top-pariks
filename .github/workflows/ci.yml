name: TOP-PARIKS CI

on:
  pull_request:
  push:
    branches:
      - '**'
      - '!production'
      - '!production/**'

permissions:
  contents: read

jobs:
  syntax:
    name: PHP, JavaScript and Bash
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check PHP syntax
        run: git ls-files -z -- '*.php' | xargs -0 -r -n 1 php -l
      - name: Check JavaScript syntax
        run: git ls-files -z -- '*.js' '*.cjs' '*.mjs' | xargs -0 -r -n 1 node --check
      - name: Check Bash syntax
        run: git ls-files -z -- '*.sh' | xargs -0 -r -n 1 bash -n

  theme:
    name: WordPress theme and ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate and package theme
        run: ./scripts/package-theme.sh "$RUNNER_TEMP/top-pariks.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: top-pariks-theme
          path: ${{ runner.temp }}/top-pariks.zip
          if-no-files-found: error

  woocommerce:
    name: WooCommerce smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: top-pariks-ci
      TOP_PARIKS_BIND: 127.0.0.1
      TOP_PARIKS_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start test store
        run: |
          docker compose config --quiet
          ./sandbox/start.sh
      - name: Check catalog, cart and offline checkout
        run: bash sandbox/woocommerce-smoke.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check customer account and AJAX cart in Chromium
        run: |
          npm install --no-save --package-lock=false playwright-core@1.56.1
          npx playwright-core install chromium
          node sandbox/mobile-ux-smoke.cjs --account
      - name: Check mobile and desktop guest checkout in Chromium
        run: node sandbox/mobile-ux-smoke.cjs
      - name: Verify demo CSV imports as drafts
        run: |
          docker compose exec -T --user www-data wordpress php /tmp/top-pariks-wp-cli.phar \
            eval-file /opt/top-pariks/demo-catalog-smoke.php
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Remove test containers and volumes
        if: always()
        run: docker compose down --volumes
