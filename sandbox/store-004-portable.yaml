services:
  db:
    image: mariadb:11.4.10
    environment:
      MARIADB_DATABASE: atelier_demo
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${ATELIER_DEMO_DB_PASSWORD:?Set a fresh demo database password}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 5s
      retries: 30
  wordpress:
    image: wordpress:7.1.5-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ATELIER_DEMO_PORT:-8086}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: atelier_demo
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${ATELIER_DEMO_DB_PASSWORD:?Set a fresh demo database password}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISABLE_WP_CRON', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_HTTP_BLOCK_EXTERNAL', true);
        define('DISALLOW_FILE_MODS', true);
    volumes:
      - wp-data:/var/www/html
volumes:
  db-data:
  wp-data:
